<!-- GAME_INFO
title: Snake
description: Classic snake game — eat, grow, and avoid the walls and your own tail.
category: Arcade
icon: 🐍
featured: true
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Ananta Games</title>
<style>
  :root{
    --primary:#8B5CF6; --secondary:#06B6D4; --accent:#F59E0B;
    --bg:#0b0b14; --surface: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.09);
    --text:#f1f0f8; --text-soft:#a8a6bd;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Segoe UI', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:20px;
  }
  a.back{
    align-self:flex-start; color:var(--text-soft); text-decoration:none; font-size:14px;
    margin-bottom:14px; padding:8px 14px; border:1px solid var(--border); border-radius:999px;
    background:var(--surface);
  }
  a.back:hover{ color:var(--text); }
  h1{ margin:0 0 6px; font-size:26px; }
  p.sub{ color:var(--text-soft); margin:0 0 18px; font-size:13.5px; }

  .hud{
    display:flex; gap:16px; margin-bottom:14px; font-family:'Consolas', monospace; font-size:14px;
  }
  .hud span{ background:var(--surface); border:1px solid var(--border); padding:6px 14px; border-radius:10px; }
  .hud b{ color:var(--accent); }

  #board{
    background:#0f0f1e;
    border:2px solid var(--border);
    border-radius:12px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }

  .controls{ margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button.ctrl{
    background:linear-gradient(120deg, var(--primary), var(--secondary));
    color:#fff; border:none; font-weight:700; padding:10px 18px; border-radius:999px;
    cursor:pointer; font-size:14px;
  }
  button.ctrl.secondary{ background:var(--surface); border:1px solid var(--border); color:var(--text); }

  .dpad{
    display:grid; grid-template-columns:repeat(3, 52px); grid-template-rows:repeat(3, 52px);
    gap:6px; margin-top:16px;
  }
  .dpad button{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:10px; font-size:18px; cursor:pointer;
  }
  .dpad button:active{ background:var(--primary); }
  .dpad .up{ grid-column:2; grid-row:1; }
  .dpad .left{ grid-column:1; grid-row:2; }
  .dpad .down{ grid-column:2; grid-row:3; }
  .dpad .right{ grid-column:3; grid-row:2; }

  .overlay{
    position:fixed; inset:0; background:rgba(5,5,10,0.82);
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    text-align:center; padding:20px;
  }
  .overlay.show{ display:flex; }
  .overlay h2{ font-size:28px; margin:0; }
  .overlay p{ color:var(--text-soft); margin:0; }

  @media (max-width:520px){
    .dpad{ display:grid; }
  }
</style>
</head>
<body>
  <a class="back" href="../index.html">← Back to Ananta Games</a>
  <h1>🐍 Snake</h1>
  <p class="sub">Arrow keys or WASD to move. Eat the orbs, avoid the walls and yourself.</p>

  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>

  <canvas id="board" width="400" height="400"></canvas>

  <div class="controls">
    <button class="ctrl" id="startBtn">▶ Start</button>
    <button class="ctrl secondary" id="pauseBtn">⏸ Pause</button>
  </div>

  <div class="dpad" aria-hidden="true">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">Game Over</h2>
    <p id="overlayText">Final score: 0</p>
    <button class="ctrl" id="restartBtn">↺ Play Again</button>
  </div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var GRID = 20;
  var CELLS = canvas.width / GRID;

  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayText = document.getElementById("overlayText");

  var STORAGE_KEY = "ananta_snake_best";
  var best = 0;
  try { best = parseInt(localStorage.getItem(STORAGE_KEY), 10) || 0; } catch(e){ best = 0; }
  bestEl.textContent = best;

  var snake, direction, nextDirection, food, score, running, paused, loopId;

  function resetState(){
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    direction = "right";
    nextDirection = "right";
    score = 0;
    scoreEl.textContent = "0";
    placeFood();
  }

  function placeFood(){
    var valid = false;
    while(!valid){
      food = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS)
      };
      valid = !snake.some(function(seg){ return seg.x === food.x && seg.y === food.y; });
    }
  }

  function draw(){
    ctx.fillStyle = "#0f0f1e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid
    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    for(var i=0;i<=CELLS;i++){
      ctx.beginPath(); ctx.moveTo(i*GRID,0); ctx.lineTo(i*GRID,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*GRID); ctx.lineTo(canvas.width,i*GRID); ctx.stroke();
    }

    // food
    ctx.fillStyle = "#F59E0B";
    ctx.beginPath();
    ctx.arc(food.x*GRID + GRID/2, food.y*GRID + GRID/2, GRID/2.6, 0, Math.PI*2);
    ctx.fill();

    // snake
    snake.forEach(function(seg, idx){
      var t = idx / snake.length;
      ctx.fillStyle = idx === 0 ? "#06B6D4" : ("rgba(139,92,246," + (1 - t*0.5) + ")");
      ctx.fillRect(seg.x*GRID+1, seg.y*GRID+1, GRID-2, GRID-2);
    });
  }

  function step(){
    direction = nextDirection;
    var head = { x: snake[0].x, y: snake[0].y };

    if(direction === "up") head.y -= 1;
    else if(direction === "down") head.y += 1;
    else if(direction === "left") head.x -= 1;
    else if(direction === "right") head.x += 1;

    // wall collision
    if(head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS){
      return gameOver();
    }
    // self collision
    if(snake.some(function(seg){ return seg.x === head.x && seg.y === head.y; })){
      return gameOver();
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){
      score += 10;
      scoreEl.textContent = String(score);
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver(){
    running = false;
    clearInterval(loopId);
    if(score > best){
      best = score;
      bestEl.textContent = String(best);
      try { localStorage.setItem(STORAGE_KEY, String(best)); } catch(e){ /* ignore */ }
    }
    overlayTitle.textContent = "Game Over";
    overlayText.textContent = "Final score: " + score;
    overlay.classList.add("show");
  }

  function start(){
    overlay.classList.remove("show");
    resetState();
    draw();
    running = true;
    paused = false;
    clearInterval(loopId);
    loopId = setInterval(function(){ if(!paused) step(); }, 110);
  }

  function togglePause(){
    if(!running) return;
    paused = !paused;
    document.getElementById("pauseBtn").textContent = paused ? "▶ Resume" : "⏸ Pause";
  }

  function setDirection(dir){
    var opposite = { up:"down", down:"up", left:"right", right:"left" };
    if(opposite[dir] === direction) return; // can't reverse into yourself
    nextDirection = dir;
  }

  document.addEventListener("keydown", function(e){
    var map = {
      ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
      w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right"
    };
    if(map[e.key]){
      e.preventDefault();
      setDirection(map[e.key]);
    } else if(e.key === " "){
      e.preventDefault();
      togglePause();
    }
  });

  document.querySelectorAll(".dpad button").forEach(function(btn){
    btn.addEventListener("click", function(){ setDirection(btn.getAttribute("data-dir")); });
  });

  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("pauseBtn").addEventListener("click", togglePause);
  document.getElementById("restartBtn").addEventListener("click", start);

  resetState();
  draw();
})();
</script>
</body>
</html>
